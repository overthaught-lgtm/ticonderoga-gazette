<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050505"/>
      <stop offset="30%"  stop-color="#c9a84c"/>
      <stop offset="70%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="#050505"/>

  <!-- LEFT PANEL -->
  <rect x="0" y="0" width="696" height="630" fill="url(#bgLeft)"/>

  <!-- GOLD TOP RULE -->
  <rect x="0" y="0" width="696" height="3" fill="url(#goldLeft)"/>

  <!-- RIGHT PANEL -->
  <rect x="696" y="0" width="504" height="630" fill="url(#bgRight)"/>

  <!-- PANEL DIVIDER -->
  <line x1="696" y1="0" x2="696" y2="630" stroke="#1e1a14" stroke-width="1"/>

  <!-- ── LEFT: BADGE ── -->
  <text x="52" y="72" font-family="Georgia, serif" font-size="11" fill="#c9a84c" letter-spacing="3">Δ TICONDEROGA SHIELD · ACTIVE · gazette.ticonderoga.online</text>

  <!-- ── LEFT: MASTHEAD ── -->
  <text x="52" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#f0ece4" letter-spacing="2">THE</text>
  <text x="52" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#f0ece4" letter-spacing="2">CRAIG</text>
  <text x="52" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#f0ece4" letter-spacing="2">GAZETTE</text>

  <!-- GOLD RULE UNDER MASTHEAD -->
  <rect x="52" y="384" width="580" height="2" fill="url(#goldRule)"/>

  <!-- ── LEFT: TAGLINE ── -->
  <rect x="52" y="408" width="3" height="72" fill="#8a2010"/>
  <text x="68" y="428" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#c9a84c">Water Finds Its Level — Three of seven trust</text>
  <text x="68" y="452" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#c9a84c">beneficiaries unsealed. Ticon Recon was</text>
  <text x="68" y="476" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#c9a84c">watching the door.</text>

  <!-- ── LEFT: FOOTER META ── -->
  <text x="52" y="572" font-family="'Courier New', monospace" font-size="10" fill="#444" letter-spacing="2">VOL. I · NO. 002</text>
  <text x="200" y="572" font-family="'Courier New', monospace" font-size="10" fill="#444" letter-spacing="2">JUNE 1, 2026</text>
  <circle cx="360" cy="568" r="4" fill="#4aaa68"/>
  <text x="370" y="572" font-family="'Courier New', monospace" font-size="10" fill="#4aaa68" letter-spacing="2">LIVE EDITION</text>
  <text x="490" y="572" font-family="'Courier New', monospace" font-size="10" fill="#8a2010" letter-spacing="2">MOFFAT CO · CO</text>

  <!-- ── LEFT: ISSUE SEAL ── -->
  <rect x="52" y="596" width="580" height="1" fill="#1a1a1a"/>
  <text x="52" y="618" font-family="'Courier New', monospace" font-size="9" fill="#2a2a2a" letter-spacing="2">LEDGER: 0x82d19bf403c22e...TICON · ALL RECORDS UNALTERABLE</text>

  <!-- ── RIGHT: KICKER ── -->
  <text x="724" y="72" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8a2010" letter-spacing="4">CHINATOWN DISPATCH · RIGBY DONOVAN</text>

  <!-- ── RIGHT: HEADLINE ── -->
  <text x="724" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold" fill="#f0ece4">Water</text>
  <text x="724" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold" fill="#f0ece4">Finds Its</text>
  <text x="724" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold" fill="#f0ece4">Level.</text>

  <!-- ── RIGHT: DECKS ── -->
  <text x="724" y="304" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#6a5a48">The sealed trust reconvened — not at the Elks</text>
  <text x="724" y="322" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#6a5a48">Lodge, but in a private room above a Craig</text>
  <text x="724" y="340" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#6a5a48">storefront. Three beneficiaries no longer sealed.</text>

  <!-- ── RIGHT: LEDGER BOX ── -->
  <rect x="724" y="362" width="444" height="136" fill="#0d0d0d" rx="0"/>
  <rect x="724" y="362" width="2"   height="136" fill="#c9a84c"/>
  <rect x="724" y="362" width="444" height="136" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <text x="740" y="385" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">EMPIRE_VALLEY_HOLDINGS</text>
  <text x="1010" y="385" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">[UNSEALED]</text>

  <text x="740" y="408" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">CONTINENTAL_YAMPA_PTR</text>
  <text x="1010" y="408" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">[UNSEALED]</text>

  <text x="740" y="431" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">WESTGATE_MINERAL_TRUST</text>
  <text x="1010" y="431" font-family="'Courier New', monospace" font-size="10" fill="#8a2010">[UNSEALED]</text>

  <text x="740" y="454" font-family="'Courier New', monospace" font-size="10" fill="#4aaa68">REMAINING_4_ENTITIES</text>
  <text x="1010" y="454" font-family="'Courier New', monospace" font-size="10" fill="#4aaa68">[SEALED]</text>

  <text x="740" y="477" font-family="'Courier New', monospace" font-size="10" fill="#c9a84c">VENUE_CHANGE_TIMESTAMP</text>
  <text x="1010" y="477" font-family="'Courier New', monospace" font-size="10" fill="#c9a84c">[FLAGGED]</text>

  <!-- ── RIGHT: STORY LIST ── -->
  <line x1="724" y1="514" x2="1168" y2="514" stroke="#1a1a1a" stroke-width="1"/>

  <text x="724" y="535" font-family="'Courier New', monospace" font-size="9" fill="#555">◆</text>
  <text x="740" y="535" font-family="'Courier New', monospace" font-size="9" fill="#888">The Elks Lodge Verdict — 3 of 7 unsealed</text>

  <text x="724" y="553" font-family="'Courier New', monospace" font-size="9" fill="#555">◆</text>
  <text x="740" y="553" font-family="'Courier New', monospace" font-size="9" fill="#888">The Assessor's Ledger — 6 days before filing</text>

  <text x="724" y="571" font-family="'Courier New', monospace" font-size="9" fill="#555">◆</text>
  <text x="740" y="571" font-family="'Courier New', monospace" font-size="9" fill="#888">City Hall Watch — public comment under threat</text>

  <!-- ── RIGHT: FOOTER ── -->
  <line x1="724" y1="596" x2="1168" y2="596" stroke="#1a1a1a" stroke-width="1"/>
  <text x="724" y="618" font-family="Georgia, serif" font-size="11" fill="#c9a84c" letter-spacing="1">Δ The Craig Gazette</text>
  <text x="1010" y="618" font-family="'Courier New', monospace" font-size="9" fill="#333" letter-spacing="1">All Records Unalterable</text>

</svg>
