  ════════════════════════════════════════════════
  INSTRUCTIONS — READ BEFORE UPLOADING
  ════════════════════════════════════════════════

  This file renders at exactly 1200 × 630px.

  TO CREATE og-image.png:
  1. Open this file in Chrome/Safari on desktop
  2. Set browser zoom to 100%
  3. Use any screenshot tool to capture exactly
     1200px wide × 630px tall
     (Chrome DevTools → Toggle Device Toolbar →
      set custom size 1200×630, then screenshot)
  4. Save as: og-image.png
  5. Upload to: gazette.ticonderoga.online/og-image.png
     (IONOS File Manager → gazette root folder)

  The Issue-002 meta block already references:
  https://gazette.ticonderoga.online/og-image.png

  Facebook Debug Tool after upload:
  https://developers.facebook.com/tools/debug
  → Paste: https://gazette.ticonderoga.online/issue-002
  → Hit "Scrape Again"

